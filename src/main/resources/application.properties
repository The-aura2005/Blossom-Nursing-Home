server.error.include-message=always
server.error.include-binding-errors=always

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/nursing_home}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG

# Vital alert thresholds. Resident weight overrides use residentId:min:max entries.
vitals.temperature.normal-min=${VITALS_TEMPERATURE_NORMAL_MIN:36.1}
vitals.temperature.normal-max=${VITALS_TEMPERATURE_NORMAL_MAX:37.2}
vitals.blood-pressure.systolic.normal-min=${VITALS_BP_SYSTOLIC_NORMAL_MIN:90}
vitals.blood-pressure.systolic.normal-max=${VITALS_BP_SYSTOLIC_NORMAL_MAX:120}
vitals.blood-pressure.diastolic.normal-min=${VITALS_BP_DIASTOLIC_NORMAL_MIN:60}
vitals.blood-pressure.diastolic.normal-max=${VITALS_BP_DIASTOLIC_NORMAL_MAX:80}
vitals.weight.default-min=${VITALS_WEIGHT_DEFAULT_MIN:0}
vitals.weight.default-max=${VITALS_WEIGHT_DEFAULT_MAX:0}
vitals.weight.resident-ranges=${VITALS_WEIGHT_RESIDENT_RANGES:}
